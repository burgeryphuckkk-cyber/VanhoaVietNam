<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Chào mừng Ngày Văn hóa Việt Nam 24/11</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Patrick+Hand&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-pink: #f9d5e5;
      --bg-gold: #f7e6c4;
      --crimson: #b31217;
      --crimson-dark: #7a090d;
      --gold-bright: #fcd34d;
      --gold-warm: #d9961a;
      --gold-deep: #9b6409;
      --ink-dark: #432318;
      --ink-soft: #6e4535;
      --paper-cream: #fdf8eb;
      --paper-edge: #f5ebd1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9d5e5;
      color: var(--ink-dark);
      user-select: none;
    }

    /* 1. Scene Setup */
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 48%, rgba(255, 250, 238, 0.55) 0%, rgba(255, 250, 238, 0) 58%),
        linear-gradient(152deg, #f9d5e5 0%, #fbe2dc 44%, #f7e6c4 100%);
    }

    /* Subtle Dong Son bronze drum watermark */
    .dong-son-watermark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(86vw, 86vh, 660px);
      height: min(86vw, 86vh, 660px);
      transform: translate(-50%, -50%);
      opacity: 0.085;
      pointer-events: none;
      z-index: 1;
      animation: drumSlowSpin 140s linear infinite;
      will-change: transform;
    }

    @keyframes drumSlowSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Top subtle floating badge */
    .top-badge {
      --badge-x: -50%;
      position: absolute;
      top: max(16px, env(safe-area-inset-top, 16px));
      left: 50%;
      transform: translateX(var(--badge-x));
      z-index: 25;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 250, 240, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(196, 132, 62, 0.34);
      box-shadow: 0 6px 20px rgba(139, 54, 72, 0.1);
      color: #84232c;
      font-weight: 700;
      font-size: clamp(0.8rem, 2.5vw, 1.02rem);
      letter-spacing: 0.01em;
      white-space: nowrap;
      max-width: calc(100vw - 140px);
      overflow: hidden;
      text-overflow: ellipsis;
      animation: badgeFloat 4s ease-in-out infinite;
      pointer-events: none;
    }

    @media (max-width: 560px) {
      .top-badge {
        --badge-x: 0%;
        left: max(12px, env(safe-area-inset-left, 12px));
        max-width: calc(100vw - 78px);
        padding: 7px 12px;
        gap: 6px;
        font-size: clamp(0.73rem, 3.1vw, 0.88rem);
      }
    }

    .top-badge svg {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
    }

    @keyframes badgeFloat {
      0%, 100% { transform: translateX(var(--badge-x)) translateY(0px); }
      50%      { transform: translateX(var(--badge-x)) translateY(-4px); }
    }

    /* Floating red-and-gold music control button in top-right corner */
    .audio-toggle {
      position: absolute;
      top: max(14px, env(safe-area-inset-top, 14px));
      right: max(14px, env(safe-area-inset-right, 14px));
      z-index: 32;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.5px solid rgba(252, 211, 77, 0.85);
      background: linear-gradient(145deg, rgba(185, 22, 28, 0.82), rgba(118, 8, 14, 0.88));
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow:
        0 6px 18px rgba(122, 14, 24, 0.25),
        inset 0 1px 2px rgba(255, 240, 180, 0.35);
      color: #fde68a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.3s ease, background 0.25s ease;
    }

    .audio-toggle.playing {
      background: linear-gradient(145deg, rgba(208, 24, 32, 0.9), rgba(138, 10, 18, 0.94));
      box-shadow:
        0 6px 20px rgba(122, 14, 24, 0.32),
        0 0 18px rgba(251, 191, 36, 0.62),
        inset 0 1px 3px rgba(255, 245, 190, 0.48);
    }

    .audio-toggle:hover {
      transform: scale(1.07);
      box-shadow:
        0 8px 22px rgba(122, 14, 24, 0.34),
        0 0 20px rgba(251, 191, 36, 0.7);
    }

    .audio-toggle:focus-visible {
      outline: 2px solid #fbbf24;
      outline-offset: 3px;
    }

    /* Spinning vinyl / lacquer disc inside button */
    .music-disc {
      width: 30px;
      height: 30px;
      animation: discSpin 5.5s linear infinite;
      animation-play-state: paused;
      transition: opacity 0.25s ease;
    }

    .audio-toggle.playing .music-disc {
      animation-play-state: running;
    }

    @keyframes discSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Subtle animated sound-wave bars overlay while playing */
    .sound-waves {
      position: absolute;
      bottom: 6px;
      right: 6px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 11px;
      padding: 2px 3px;
      border-radius: 6px;
      background: rgba(118, 8, 14, 0.85);
      border: 1px solid rgba(252, 211, 77, 0.6);
      opacity: 0;
      transform: scale(0.75);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    .audio-toggle.playing .sound-waves {
      opacity: 1;
      transform: scale(1);
    }

    .sound-waves span {
      width: 2px;
      height: 4px;
      border-radius: 2px;
      background: #fde047;
      animation: waveBounce 0.9s ease-in-out infinite;
    }

    .sound-waves span:nth-child(2) { animation-delay: 0.2s; }
    .sound-waves span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes waveBounce {
      0%, 100% { height: 3px; }
      50%      { height: 9px; }
    }

    /* Paused badge slash/play cue */
    .music-paused-dot {
      position: absolute;
      bottom: 5px;
      right: 5px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff8e7;
      border: 1px solid #d97706;
      color: #b31217;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    .audio-toggle.playing .music-paused-dot {
      opacity: 0;
      transform: scale(0.6);
    }

    /* Custom Vietnamese hover/focus tooltip */
    .audio-toggle::after {
      content: attr(data-tooltip);
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(122, 9, 13, 0.92);
      border: 1px solid rgba(252, 211, 77, 0.65);
      color: #fef3c7;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 6px 14px rgba(80, 12, 18, 0.22);
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .audio-toggle:hover::after,
    .audio-toggle:focus-visible::after {
      opacity: 1;
      transform: translateY(0);
    }

    /* Fireworks & Flower Burst Canvases */
    #fireworks {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Floating Stage Layer for Polaroids, Stickers, Bubbles, Spinning Flowers */
    .floating-layer {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      overflow: hidden;
    }

    /* 2. Opening Gift Box Container */
    .container {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition:
        top 0.95s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.95s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: top, transform;
      outline: none;
    }

    .container:focus-visible .gift-wrapper {
      filter: drop-shadow(0 0 18px rgba(217, 150, 26, 0.85));
    }

    .container.anchored {
      top: calc(100% - 16px);
      transform: translate(-50%, -100%) scale(0.72);
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .container.anchored {
        top: calc(100% - 10px);
        transform: translate(-50%, -100%) scale(0.62);
      }
    }

    .gift-wrapper {
      position: relative;
      width: clamp(180px, 42vw, 236px);
      height: clamp(185px, 43vw, 240px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      animation: giftShake 2.6s ease-in-out infinite;
      transform-origin: 50% 88%;
      filter: drop-shadow(0 16px 24px rgba(110, 22, 32, 0.24));
      will-change: transform;
    }

    .container.opened .gift-wrapper {
      animation: none;
    }

    .container.opened.box-bounce .gift-wrapper {
      animation: boxPopPulse 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes giftShake {
      0%, 58%, 100% { transform: rotate(0deg) scale(1); }
      64%  { transform: rotate(-3.2deg) scale(1.025); }
      70%  { transform: rotate(3.2deg) scale(1.03); }
      76%  { transform: rotate(-2.5deg) scale(1.025); }
      82%  { transform: rotate(2.2deg) scale(1.02); }
      88%  { transform: rotate(-1deg) scale(1.01); }
    }

    @keyframes boxPopPulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.09, 0.93); }
      75%  { transform: scale(0.97, 1.04); }
      100% { transform: scale(1); }
    }

    /* Gift lid & base stacked seamlessly */
    .gift-lid {
      position: absolute;
      top: 0;
      left: 50%;
      width: 100%;
      transform: translateX(-50%);
      z-index: 3;
      transition:
        transform 0.72s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.6s ease;
      transform-origin: center bottom;
      pointer-events: none;
    }

    .container.opened .gift-lid {
      transform: translateX(-62%) translateY(-160px) rotate(-24deg) scale(1.06);
      opacity: 0;
    }

    .gift-base {
      position: relative;
      width: 92%;
      z-index: 2;
      pointer-events: none;
    }

    .gift-glow {
      position: absolute;
      bottom: 42%;
      left: 50%;
      width: 78%;
      height: 55px;
      transform: translateX(-50%) scale(0.4);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 241, 168, 0.95) 0%, rgba(255, 198, 92, 0.45) 55%, rgba(255, 198, 92, 0) 100%);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.7s ease;
    }

    .container.opened .gift-glow {
      opacity: 1;
      transform: translateX(-50%) scale(1.15);
      animation: innerGlowPulse 2.4s ease-in-out infinite;
    }

    @keyframes innerGlowPulse {
      0%, 100% { opacity: 0.78; transform: translateX(-50%) scale(1.1); }
      50%      { opacity: 1;    transform: translateX(-50%) scale(1.25); }
    }

    .gift-prompt {
      margin-top: 14px;
      padding: 7px 16px;
      border-radius: 999px;
      background: rgba(255, 250, 240, 0.82);
      border: 1px solid rgba(196, 132, 62, 0.38);
      box-shadow: 0 4px 14px rgba(130, 36, 48, 0.12);
      color: #8b131a;
      font-weight: 700;
      font-size: clamp(0.88rem, 2.8vw, 1.04rem);
      letter-spacing: 0.01em;
      white-space: nowrap;
      animation: promptPulse 1.9s ease-in-out infinite;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .container.opened .gift-prompt {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    @keyframes promptPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 4px 14px rgba(130, 36, 48, 0.12); }
      50%      { transform: scale(1.04); box-shadow: 0 6px 20px rgba(194, 128, 34, 0.28); }
    }

    /* 4. Polaroid Cards */
    .polaroid-card {
      position: absolute;
      left: 50%;
      bottom: 84px;
      width: clamp(112px, 27vw, 174px);
      padding: 8px 8px 10px 8px;
      background: #fffdf7;
      border-radius: 10px;
      border: 1.5px solid rgba(252, 211, 77, 0.85);
      box-shadow:
        0 0 22px rgba(255, 216, 112, 0.72),
        0 10px 26px rgba(110, 28, 42, 0.22);
      transform-origin: center center;
      will-change: transform, opacity;
    }

    .polaroid-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      object-fit: cover;
      background: #fbe6dc;
    }

    .polaroid-caption {
      margin-top: 7px;
      text-align: center;
      font-family: 'Patrick Hand', 'Quicksand', cursive, sans-serif;
      font-size: clamp(0.82rem, 2.6vw, 1.02rem);
      font-weight: 600;
      color: #6b241c;
      line-height: 1.15;
      letter-spacing: 0.01em;
    }

    /* Cultural Stickers */
    .cultural-sticker {
      position: absolute;
      left: 50%;
      bottom: 86px;
      width: clamp(54px, 13vw, 82px);
      height: clamp(54px, 13vw, 82px);
      filter: drop-shadow(0 6px 12px rgba(110, 28, 42, 0.22));
      will-change: transform, opacity;
    }

    .cultural-sticker img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* 7. Rising Circular Photo Bubbles & Spinning Flowers */
    .photo-bubble {
      position: absolute;
      left: 50%;
      bottom: 82px;
      width: clamp(82px, 21vw, 134px);
      height: clamp(82px, 21vw, 134px);
      border-radius: 50%;
      padding: 5px;
      background: var(--bubble-ring, linear-gradient(135deg, #fb7185, #fbbf24));
      box-shadow:
        0 0 20px var(--bubble-glow, rgba(251, 146, 60, 0.55)),
        inset 0 0 8px rgba(255, 255, 255, 0.8),
        0 10px 24px rgba(100, 24, 38, 0.2);
      will-change: transform, opacity;
    }

    .photo-bubble-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: #fff9f0;
      border: 2px solid rgba(255, 255, 255, 0.88);
    }

    .photo-bubble-inner img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* Glossy soap-bubble specular crescent */
    .photo-bubble-inner::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: radial-gradient(circle at 28% 22%, rgba(255, 255, 255, 0.52) 0%, rgba(255, 255, 255, 0.14) 24%, rgba(255, 255, 255, 0) 56%);
      pointer-events: none;
    }

    .spinning-flower {
      position: absolute;
      left: 50%;
      bottom: 82px;
      width: clamp(36px, 9vw, 56px);
      height: clamp(36px, 9vw, 56px);
      filter: drop-shadow(0 4px 10px rgba(130, 36, 52, 0.2));
      will-change: transform, opacity;
    }

    /* 5. Traditional Envelope Icon */
    .envelope-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 22;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 38vh) scale(0.32);
      transition:
        transform 1.15s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.65s ease;
      cursor: pointer;
      outline: none;
    }

    .envelope-wrap.rising {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -56%) scale(1);
    }

    .envelope-wrap.pulsing .envelope-inner {
      animation: envelopePulse 2s ease-in-out infinite;
    }

    .envelope-inner {
      position: relative;
      width: clamp(134px, 32vw, 178px);
      filter: drop-shadow(0 16px 28px rgba(132, 18, 28, 0.32));
      transition: filter 0.25s ease, transform 0.25s ease;
    }

    .envelope-wrap:hover .envelope-inner,
    .envelope-wrap:focus-visible .envelope-inner {
      filter: drop-shadow(0 0 24px rgba(251, 191, 36, 0.85));
      transform: scale(1.06);
    }

    @keyframes envelopePulse {
      0%, 100% {
        transform: translateY(0px) scale(1);
        filter: drop-shadow(0 14px 24px rgba(132, 18, 28, 0.3)) drop-shadow(0 0 12px rgba(252, 211, 77, 0.45));
      }
      50% {
        transform: translateY(-7px) scale(1.06);
        filter: drop-shadow(0 20px 32px rgba(132, 18, 28, 0.36)) drop-shadow(0 0 26px rgba(252, 211, 77, 0.85));
      }
    }

    .envelope-hint {
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(255, 250, 240, 0.88);
      border: 1px solid rgba(196, 132, 62, 0.4);
      color: #8b131a;
      font-weight: 700;
      font-size: clamp(0.8rem, 2.5vw, 0.94rem);
      box-shadow: 0 4px 12px rgba(120, 30, 42, 0.14);
      white-space: nowrap;
    }

    /* 6. Letter Card (Do paper style) */
    .letter-backdrop {
      position: absolute;
      inset: 0;
      z-index: 26;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 16px 118px 16px;
      background: rgba(68, 24, 30, 0.12);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    @media (max-width: 600px) {
      .letter-backdrop {
        padding: 58px 12px 104px 12px;
      }
    }

    .letter-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .letter-card {
      position: relative;
      width: min(92vw, 560px);
      max-height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 24px;
      background:
        radial-gradient(circle at 18% 15%, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0) 55%),
        radial-gradient(circle at 82% 88%, rgba(242, 224, 188, 0.55) 0%, rgba(242, 224, 188, 0) 55%),
        linear-gradient(165deg, #fffdf7 0%, #fbf3df 54%, #f6ebd1 100%);
      border: 1.5px solid rgba(206, 159, 86, 0.48);
      box-shadow:
        0 24px 60px rgba(84, 24, 28, 0.24),
        0 0 0 6px rgba(255, 249, 236, 0.42),
        inset 0 0 28px rgba(224, 192, 134, 0.25);
      transform: translateY(18px) scale(0.92);
      opacity: 0;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
      overflow: hidden;
    }

    .letter-backdrop.visible .letter-card {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    /* Delicate Do-paper inner frame */
    .letter-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 16px;
      border: 1px dashed rgba(196, 146, 76, 0.32);
      pointer-events: none;
    }

    .letter-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 52px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(206, 159, 86, 0.22);
    }

    .pastel-dots {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pastel-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .pastel-dot.dot-pink { background: #f49bb8; }
    .pastel-dot.dot-gold { background: #f3c868; }
    .pastel-dot.dot-jade { background: #92d1be; }

    .letter-close {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #8b3b34;
      font-size: 26px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .letter-close:hover {
      background: rgba(179, 18, 23, 0.1);
      color: #b31217;
      transform: translateY(-50%) scale(1.08);
    }

    .letter-close:focus-visible {
      outline: 2px solid #b31217;
      outline-offset: -2px;
    }

    .letter-body {
      position: relative;
      padding: 16px 26px 26px 26px;
      overflow-y: auto;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: rgba(196, 146, 76, 0.45) transparent;
      user-select: text;
    }

    @media (max-width: 600px) {
      .letter-body {
        padding: 14px 20px 22px 20px;
      }
    }

    .letter-body::-webkit-scrollbar {
      width: 5px;
    }
    .letter-body::-webkit-scrollbar-thumb {
      background: rgba(196, 146, 76, 0.4);
      border-radius: 999px;
    }

    .letter-text {

  <script>
    (() => {
      "use strict";

      /* ============================================================
         0. POPULATE DONG SON BRONZE DRUM WATERMARK GEOMETRY
         ============================================================ */
      function buildDongSonWatermark() {
        const starGroup = document.getElementById("drum-star");
        const ringsGroup = document.getElementById("drum-rings");
        const ns = "http://www.w3.org/2000/svg";
        const cx = 300, cy = 300;
        const points = 14;

        // 14-point sun star
        let starPath = "";
        for (let i = 0; i < points * 2; i++) {
          const angle = (i * Math.PI) / points - Math.PI / 2;
          const r = i % 2 === 0 ? 84 : 42;
          const x = cx + Math.cos(angle) * r;
          const y = cy + Math.sin(angle) * r;
          starPath += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
        }
        starPath += "Z";
        const starEl = document.createElementNS(ns, "path");
        starEl.setAttribute("d", starPath);
        starGroup.appendChild(starEl);

        // Interstitial geometric feather triangles between rays
        for (let i = 0; i < points; i++) {
          const aMid = ((i + 0.5) * 2 * Math.PI) / points - Math.PI / 2;
          const a1 = aMid - 0.14;
          const a2 = aMid + 0.14;
          const tip = { x: cx + Math.cos(aMid) * 58, y: cy + Math.sin(aMid) * 58 };
          const b1  = { x: cx + Math.cos(a1) * 85,   y: cy + Math.sin(a1) * 85 };
          const b2  = { x: cx + Math.cos(a2) * 85,   y: cy + Math.sin(a2) * 85 };
          const tri = document.createElementNS(ns, "path");
          tri.setAttribute("d", `M${tip.x.toFixed(1)} ${tip.y.toFixed(1)} L${b1.x.toFixed(1)} ${b1.y.toFixed(1)} L${b2.x.toFixed(1)} ${b2.y.toFixed(1)} Z`);
          tri.setAttribute("fill", "none");
          tri.setAttribute("stroke", "#85581d");
          tri.setAttribute("stroke-width", "1.5");
          ringsGroup.appendChild(tri);
        }

        // Sawtooth combed teeth rings (r = 95..114 and r = 225..246)
        const sawCount = 48;
        for (let i = 0; i < sawCount; i++) {
          const a1 = (i * 2 * Math.PI) / sawCount;
          const a2 = ((i + 0.5) * 2 * Math.PI) / sawCount;
          const a3 = ((i + 1) * 2 * Math.PI) / sawCount;
          const p = document.createElementNS(ns, "path");
          p.setAttribute("d",
            `M${(cx + Math.cos(a1)*92).toFixed(1)} ${(cy + Math.sin(a1)*92).toFixed(1)} ` +
            `L${(cx + Math.cos(a2)*114).toFixed(1)} ${(cy + Math.sin(a2)*114).toFixed(1)} ` +
            `L${(cx + Math.cos(a3)*92).toFixed(1)} ${(cy + Math.sin(a3)*92).toFixed(1)}`
          );
          p.setAttribute("stroke-width", "1.5");
          ringsGroup.appendChild(p);
        }

        // Concentric circle-and-tangent band (r = 136)
        const dotCount = 24;
        for (let i = 0; i < dotCount; i++) {
          const a = (i * 2 * Math.PI) / dotCount;
          const bx = cx + Math.cos(a) * 136;
          const by = cy + Math.sin(a) * 136;
          const c1 = document.createElementNS(ns, "circle");
          c1.setAttribute("cx", bx.toFixed(1));
          c1.setAttribute("cy", by.toFixed(1));
          c1.setAttribute("r", "7");
          c1.setAttribute("stroke-width", "1.6");
          ringsGroup.appendChild(c1);

          const c2 = document.createElementNS(ns, "circle");
          c2.setAttribute("cx", bx.toFixed(1));
          c2.setAttribute("cy", by.toFixed(1));
          c2.setAttribute("r", "2.2");
          c2.setAttribute("fill", "#85581d");
          ringsGroup.appendChild(c2);
        }

        // 8 Stylized Flying Lac Birds in ring r = 176
        const birds = 8;
        for (let i = 0; i < birds; i++) {
          const deg = i * (360 / birds);
          const g = document.createElementNS(ns, "g");
          g.setAttribute("transform", `translate(${cx},${cy}) rotate(${deg}) translate(0,-176)`);
          const bird = document.createElementNS(ns, "path");
          bird.setAttribute("d", "M-26 2 L-8 -2 L2 -10 L18 -4 L34 -7 L18 1 L6 2 L-8 10 L-22 12 L-14 5 Z");
          bird.setAttribute("fill", "#85581d");
          bird.setAttribute("fill-opacity", "0.28");
          bird.setAttribute("stroke-width", "1.6");
          const crest = document.createElementNS(ns, "path");
          crest.setAttribute("d", "M8 -6 C2 -15 -8 -16 -14 -12");
          crest.setAttribute("stroke-width", "1.5");
          g.appendChild(bird);
          g.appendChild(crest);
          ringsGroup.appendChild(g);
        }

        // Outer dashed ticks between r=222 and r=252
        for (let i = 0; i < 64; i++) {
          const a = (i * 2 * Math.PI) / 64;
          const line = document.createElementNS(ns, "line");
          line.setAttribute("x1", (cx + Math.cos(a) * 224).toFixed(1));
          line.setAttribute("y1", (cy + Math.sin(a) * 224).toFixed(1));
          line.setAttribute("x2", (cx + Math.cos(a) * 250).toFixed(1));
          line.setAttribute("y2", (cy + Math.sin(a) * 250).toFixed(1));
          line.setAttribute("stroke-width", i % 2 === 0 ? "2" : "1.2");
          ringsGroup.appendChild(line);
        }
      }
      buildDongSonWatermark();

      /* ============================================================
         1. BACKGROUND MUSIC CONTROLLER (VNTVSN.mp3 + 1.5s Fade-In)
         ============================================================ */
      const bgMusic = document.getElementById("bg-music");
      const audioToggle = document.getElementById("audioToggle");
      const TARGET_VOLUME = 0.8;
      const FADE_DURATION_MS = 1500;
      let musicStarted = false;
      let userPausedMusic = false;
      let fadeRafId = null;

      function cancelVolumeFade() {
        if (fadeRafId !== null) {
          cancelAnimationFrame(fadeRafId);
          fadeRafId = null;
        }
      }

      function fadeInAudio(fromVol, toVol, durationMs) {
        cancelVolumeFade();
        const startVol = Math.max(0, Math.min(1, fromVol));
        const endVol = Math.max(0, Math.min(1, toVol));
        bgMusic.volume = startVol;
        const startTime = performance.now();

        function stepFade(now) {
          if (bgMusic.paused) {
            fadeRafId = null;
            return;
          }
          const progress = Math.min(1, (now - startTime) / durationMs);
          // Smooth ease-out curve from 0.0 to 0.8
          const eased = 1 - Math.pow(1 - progress, 2);
          bgMusic.volume = startVol + (endVol - startVol) * eased;
          if (progress < 1) {
            fadeRafId = requestAnimationFrame(stepFade);
          } else {
            bgMusic.volume = endVol;
            fadeRafId = null;
          }
        }
        fadeRafId = requestAnimationFrame(stepFade);
      }

      function syncMusicButtonUI() {
        const isPlaying = !bgMusic.paused && !bgMusic.ended;
        audioToggle.classList.toggle("playing", isPlaying);
        audioToggle.setAttribute("aria-pressed", isPlaying ? "true" : "false");
      }

      bgMusic.addEventListener("play", syncMusicButtonUI);
      bgMusic.addEventListener("pause", syncMusicButtonUI);
      bgMusic.addEventListener("ended", syncMusicButtonUI);

      function startBgMusicOnGiftClick() {
        if (musicStarted || userPausedMusic) return;
        musicStarted = true;
        bgMusic.volume = 0;
        const playPromise = bgMusic.play();
        if (playPromise && typeof playPromise.then === "function") {
          playPromise
            .then(() => {
              syncMusicButtonUI();
              fadeInAudio(0.0, TARGET_VOLUME, FADE_DURATION_MS);
            })
            .catch(() => {
              musicStarted = false;
              syncMusicButtonUI();
            });
        } else {
          syncMusicButtonUI();
          fadeInAudio(0.0, TARGET_VOLUME, FADE_DURATION_MS);
        }
      }

      audioToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        if (bgMusic.paused) {
          userPausedMusic = false;
          const isFirstStart = !musicStarted;
          musicStarted = true;
          const fromVol = isFirstStart ? 0.0 : Math.min(bgMusic.volume, 0.15);
          const fadeMs = isFirstStart ? FADE_DURATION_MS : 450;
          bgMusic.volume = fromVol;
          const p = bgMusic.play();
          if (p && typeof p.then === "function") {
            p.then(() => {
              syncMusicButtonUI();
              fadeInAudio(fromVol, TARGET_VOLUME, fadeMs);
            }).catch(() => {
              syncMusicButtonUI();
            });
          } else {
            syncMusicButtonUI();
            fadeInAudio(fromVol, TARGET_VOLUME, fadeMs);
          }
        } else {
          userPausedMusic = true;
          cancelVolumeFade();
          bgMusic.pause();
          syncMusicButtonUI();
        }
      });

      /* ============================================================
         3. PRE-RENDERED 2X DPR FLOWER SPRITES (Lotus, Dao, Mai, Cuc)
            Used by BOTH the full-screen Blooming Flower Burst AND spinning flowers!
         ============================================================ */
      const flowerSprites = {};

      function createFlowerSprites() {
        const size = 220;
        const makeCanvas = (drawFn) => {
          const c = document.createElement("canvas");
          c.width = size;
          c.height = size;
          const g = c.getContext("2d");
          g.translate(size / 2, size / 2);
          drawFn(g, size * 0.43);
          return c;
        };

        // 1. Pink Lotus (Hoa Sen Hong)
        flowerSprites.lotus = makeCanvas((g, r) => {
          const drawLayer = (count, len, wid, col1, col2, rotOffset) => {
            for (let i = 0; i < count; i++) {
              g.save();
              g.rotate((i * Math.PI * 2) / count + rotOffset);
              const grad = g.createLinearGradient(0, 0, 0, -len);
              grad.addColorStop(0, col1);
              grad.addColorStop(1, col2);
              g.fillStyle = grad;
              g.beginPath();
              g.moveTo(0, 0);
              g.quadraticCurveTo(wid, -len * 0.45, 0, -len);
              g.quadraticCurveTo(-wid, -len * 0.45, 0, 0);
              g.fill();
              g.strokeStyle = "rgba(190, 24, 93, 0.3)";
              g.lineWidth = 1.5;
              g.stroke();
              g.restore();
            }
          };
          drawLayer(8, r, r * 0.34, "#f472b6", "#fce7f3", 0);
          drawLayer(8, r * 0.78, r * 0.28, "#ec4899", "#fbcfe8", Math.PI / 8);
          g.fillStyle = "#fde047";
          g.beginPath();
          g.arc(0, 0, r * 0.2, 0, Math.PI * 2);
          g.fill();
          g.fillStyle = "#d97706";
          for (let i = 0; i < 10; i++) {
            const a = (i * Math.PI * 2) / 10;
            g.beginPath();
            g.arc(Math.cos(a) * r * 0.22, Math.sin(a) * r * 0.22, 2.8, 0, Math.PI * 2);
            g.fill();
          }
        });

        // 2. Peach Blossom (Hoa Dao)
        flowerSprites.dao = makeCanvas((g, r) => {
          for (let i = 0; i < 5; i++) {
            g.save();
            g.rotate((i * Math.PI * 2) / 5);
            const grad = g.createRadialGradient(0, -r * 0.2, r * 0.05, 0, -r * 0.55, r * 0.6);
            grad.addColorStop(0, "#e11d48");
            grad.addColorStop(0.32, "#fb7185");
            grad.addColorStop(1, "#fbcfe8");
            g.fillStyle = grad;
            g.beginPath();
            g.moveTo(0, 0);
            g.bezierCurveTo(-r * 0.45, -r * 0.35, -r * 0.42, -r * 0.92, -r * 0.08, -r * 0.94);
            g.lineTo(0, -r * 0.84);
            g.lineTo(r * 0.08, -r * 0.94);
            g.bezierCurveTo(r * 0.42, -r * 0.92, r * 0.45, -r * 0.35, 0, 0);
            g.fill();
            g.restore();
          }
          g.fillStyle = "#9f1239";
          g.beginPath();
          g.arc(0, 0, r * 0.14, 0, Math.PI * 2);
          g.fill();
          g.strokeStyle = "#fde047";
          g.lineWidth = 2;
          for (let i = 0; i < 12; i++) {
            const a = (i * Math.PI * 2) / 12;
            g.beginPath();
            g.moveTo(0, 0);
            g.lineTo(Math.cos(a) * r * 0.3, Math.sin(a) * r * 0.3);
            g.stroke();
            g.fillStyle = "#fef08a";
            g.beginPath();
            g.arc(Math.cos(a) * r * 0.32, Math.sin(a) * r * 0.32, 2.5, 0, Math.PI * 2);
            g.fill();
          }
        });

        // 3. Yellow Apricot Blossom (Hoa Mai Vang)
        flowerSprites.mai = makeCanvas((g, r) => {
          for (let i = 0; i < 5; i++) {
            g.save();
            g.rotate((i * Math.PI * 2) / 5);
            const grad = g.createRadialGradient(0, -r * 0.25, r * 0.05, 0, -r * 0.55, r * 0.58);
            grad.addColorStop(0, "#d97706");
            grad.addColorStop(0.35, "#f59e0b");
            grad.addColorStop(1, "#fef08a");
            g.fillStyle = grad;
            g.beginPath();
            g.moveTo(0, 0);
            g.bezierCurveTo(-r * 0.46, -r * 0.32, -r * 0.46, -r * 0.96, 0, -r * 0.96);
            g.bezierCurveTo(r * 0.46, -r * 0.96, r * 0.46, -r * 0.32, 0, 0);
            g.fill();
            g.restore();
          }
          g.strokeStyle = "#b45309";
          g.lineWidth = 2;
          for (let i = 0; i < 14; i++) {
            const a = (i * Math.PI * 2) / 14;
            g.beginPath();
            g.moveTo(0, 0);
            g.lineTo(Math.cos(a) * r * 0.28, Math.sin(a) * r * 0.28);
            g.stroke();
            g.fillStyle = "#dc2626";
            g.beginPath();
            g.arc(Math.cos(a) * r * 0.3, Math.sin(a) * r * 0.3, 2.4, 0, Math.PI * 2);
            g.fill();
          }
          g.fillStyle = "#b91c1c";
          g.beginPath();
          g.arc(0, 0, r * 0.1, 0, Math.PI * 2);
          g.fill();
        });

        // 4. Chrysanthemum (Hoa Cuc)
        flowerSprites.cuc = makeCanvas((g, r) => {
          const drawPetals = (n, rad, wid, c1, c2, offset) => {
            for (let i = 0; i < n; i++) {
              g.save();
              g.rotate((i * Math.PI * 2) / n + offset);
              const grad = g.createLinearGradient(0, 0, 0, -rad);
              grad.addColorStop(0, c1);
              grad.addColorStop(1, c2);
              g.fillStyle = grad;
              g.beginPath();
              g.ellipse(0, -rad * 0.54, wid, rad * 0.48, 0, 0, Math.PI * 2);
              g.fill();
              g.restore();
            }
          };
          drawPetals(18, r, r * 0.12, "#ea580c", "#fde047", 0);
          drawPetals(16, r * 0.78, r * 0.11, "#f59e0b", "#fef9c3", 0.12);
          drawPetals(12, r * 0.54, r * 0.09, "#d97706", "#fef08a", 0.25);
          g.fillStyle = "#b45309";
          g.beginPath();
          g.arc(0, 0, r * 0.17, 0, Math.PI * 2);
          g.fill();
        });
      }
      createFlowerSprites();
      const FLOWER_KEYS = ["lotus", "dao", "mai", "cuc"];
      const flowerDataUrls = {};
      FLOWER_KEYS.forEach((k) => {
        flowerDataUrls[k] = flowerSprites[k].toDataURL();
      });

      /* ============================================================
         4. CONTINUOUS FIREWORKS CANVAS ENGINE
         ============================================================ */
      const fwCanvas = document.getElementById("fireworks");
      const fwCtx = fwCanvas.getContext("2d");
      let vw = window.innerWidth;
      let vh = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      const burstCanvas = document.getElementById("flower-burst");
      const burstCtx = burstCanvas.getContext("2d");

      function resizeCanvases() {
        vw = window.innerWidth;
        vh = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        fwCanvas.width = Math.floor(vw * dpr);
        fwCanvas.height = Math.floor(vh * dpr);
        fwCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        burstCanvas.width = Math.floor(vw * dpr);
        burstCanvas.height = Math.floor(vh * dpr);
        burstCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resizeCanvases();
      window.addEventListener("resize", resizeCanvases);

      const FIREWORK_PALETTES = [
        ["#e11d48", "#fb7185", "#fde047"], // Crimson & Gold
        ["#db2777", "#f472b6", "#fef08a"], // Lotus Magenta
        ["#d97706", "#f59e0b", "#fef3c7"], // Imperial Gold
        ["#059669", "#34d399", "#fde047"], // Jade & Gold
        ["#2563eb", "#60a5fa", "#fbcfe8"], // Sapphire & Rose
        ["#7c3aed", "#c084fc", "#fde047"]  // Royal Violet
      ];

      let fireworksActive = false;
      const rockets = [];
      const sparks = [];
      let rocketTimer = 0;

      function spawnRocket() {
        const x = vw * (0.12 + Math.random() * 0.76);
        const targetY = vh * (0.12 + Math.random() * 0.42);
        const palette = FIREWORK_PALETTES[Math.floor(Math.random() * FIREWORK_PALETTES.length)];
        rockets.push({
          x,
          y: vh + 10,
          vx: (Math.random() - 0.5) * 65,
          vy: -(Math.sqrt(2 * 380 * (vh - targetY)) + Math.random() * 45),
          targetY,
          palette,
          trail: []
        });
      }

      function explodeRocket(r) {
        const count = vw < 600 ? 44 : 64;
        const style = Math.random();
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.14;
          const speed = style < 0.35
            ? 145 + Math.random() * 35  // crisp ring
            : 60 + Math.random() * 175; // full chrysanthemum burst
          sparks.push({
            x: r.x,
            y: r.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: r.palette[i % r.palette.length],
            size: 2.0 + Math.random() * 2.2,
            life: 0,
            maxLife: 1.05 + Math.random() * 0.65,
            drag: 0.962,
            twinkle: Math.random() > 0.45
          });
        }
      }

      function updateFireworks(dt) {
        fwCtx.clearRect(0, 0, vw, vh);
        if (!fireworksActive && rockets.length === 0 && sparks.length === 0) return;

        if (fireworksActive) {
          rocketTimer -= dt;
          if (rocketTimer <= 0) {
            spawnRocket();
            if (Math.random() < 0.42) spawnRocket();
            rocketTimer = 0.52 + Math.random() * 0.55;
          }
        }

        // Update rockets
        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          r.trail.push({ x: r.x, y: r.y });
          if (r.trail.length > 6) r.trail.shift();

          r.x += r.vx * dt;
          r.y += r.vy * dt;
          r.vy += 380 * dt;

          // Draw trail
          for (let t = 0; t < r.trail.length; t++) {
            const p = r.trail[t];
            fwCtx.globalAlpha = ((t + 1) / r.trail.length) * 0.55;
            fwCtx.fillStyle = r.palette[0];
            fwCtx.beginPath();
            fwCtx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
            fwCtx.fill();
          }

          fwCtx.globalAlpha = 0.95;
          fwCtx.fillStyle = "#fffbeb";
          fwCtx.beginPath();
          fwCtx.arc(r.x, r.y, 3, 0, Math.PI * 2);
          fwCtx.fill();

          if (r.vy >= -25 || r.y <= r.targetY) {
            explodeRocket(r);
            rockets.splice(i, 1);
          }
        }

        // Update sparks
        for (let i = sparks.length - 1; i >= 0; i--) {
          const s = sparks[i];
          s.life += dt;
          if (s.life >= s.maxLife) {
            sparks.splice(i, 1);
            continue;
          }
          const damp = Math.pow(s.drag, dt * 60);
          s.vx *= damp;
          s.vy = s.vy * damp + 125 * dt;
          s.x += s.vx * dt;
          s.y += s.vy * dt;

          const progress = s.life / s.maxLife;
          let alpha = 1 - progress * progress;
          if (s.twinkle && progress > 0.45) {
            alpha *= 0.5 + 0.5 * Math.sin(s.life * 28);
          }

          fwCtx.globalAlpha = Math.max(0, alpha * 0.9);
          fwCtx.fillStyle = s.color;
          fwCtx.beginPath();
          fwCtx.arc(s.x, s.y, s.size * (1 - progress * 0.35), 0, Math.PI * 2);
          fwCtx.fill();

          // Soft luminous core
          if (progress < 0.55) {
            fwCtx.globalAlpha = Math.max(0, (1 - progress * 1.8) * 0.65);
            fwCtx.fillStyle = "#fffdf5";
            fwCtx.beginPath();
            fwCtx.arc(s.x, s.y, s.size * 0.45, 0, Math.PI * 2);
            fwCtx.fill();
          }
        }
        fwCtx.globalAlpha = 1;
      }

      /* ============================================================
         5. FULL-SCREEN BLOOMING FLOWER BURST ENGINE
         ============================================================ */
      let burstAnim = null;

      function triggerFlowerBurst(durationMs = 1750, onPeak = null) {
        const particles = [];
        const count = vw < 600 ? 64 : 92;
        const maxRadius = Math.hypot(vw, vh) * 0.62;
        const baseFlowerSize = Math.max(vw, vh) * 0.24;

        // Dense radial flowers covering 100% of viewport
        for (let i = 0; i < count; i++) {
          const ringFrac = i / count;
          const angle = i * 2.39996 + (Math.random() - 0.5) * 0.35; // golden angle spiral for uniform dense coverage
          const dist = Math.sqrt(ringFrac) * maxRadius * (0.85 + Math.random() * 0.35);
          particles.push({
            sprite: flowerSprites[FLOWER_KEYS[i % FLOWER_KEYS.length]],
            tx: vw * 0.5 + Math.cos(angle) * dist,
            ty: vh * 0.52 + Math.sin(angle) * dist,
            sx: vw * 0.5 + (Math.random() - 0.5) * 40,
            sy: vh * 0.55 + (Math.random() - 0.5) * 40,
            targetSize: baseFlowerSize * (0.72 + Math.random() * 0.92),
            rotStart: (Math.random() - 0.5) * 1.6,
            rotEnd: (Math.random() - 0.5) * 2.8,
            delay: ringFrac * 0.22
          });
        }

        burstAnim = {
          start: performance.now(),
          duration: durationMs,
          particles,
          peakCalled: false,
          onPeak
        };
      }

      function updateFlowerBurst(now) {
        burstCtx.clearRect(0, 0, vw, vh);
        if (!burstAnim) return;

        const elapsed = now - burstAnim.start;
        const tNorm = elapsed / burstAnim.duration;

        if (tNorm >= 0.48 && !burstAnim.peakCalled) {
          burstAnim.peakCalled = true;
          if (typeof burstAnim.onPeak === "function") burstAnim.onPeak();
        }

        if (tNorm >= 1) {
          burstAnim = null;
          return;
        }

        // Smooth scale-up covering screen, then smooth fade out
        for (let i = 0; i < burstAnim.particles.length; i++) {
          const p = burstAnim.particles[i];
          const localT = Math.max(0, Math.min(1, (tNorm - p.delay) / (1 - p.delay)));
          if (localT <= 0) continue;

          // EaseOutExpo expansion
          const expandEase = 1 - Math.pow(1 - Math.min(1, localT * 1.45), 3);
          const x = p.sx + (p.tx - p.sx) * expandEase;
          const y = p.sy + (p.ty - p.sy) * expandEase;
          const sz = p.targetSize * (0.12 + 0.96 * expandEase);
          const rot = p.rotStart + (p.rotEnd - p.rotStart) * expandEase;

          let alpha = 1;
          if (localT < 0.14) alpha = localT / 0.14;
          else if (tNorm > 0.54) alpha = Math.max(0, 1 - (tNorm - 0.54) / 0.46);

          burstCtx.save();
          burstCtx.globalAlpha = alpha;
          burstCtx.translate(x, y);
          burstCtx.rotate(rot);
          burstCtx.drawImage(p.sprite, -sz / 2, -sz / 2, sz, sz);
          burstCtx.restore();
        }
      }

      /* ============================================================
         6. FLOATING POLAROIDS, STICKERS, PHOTO BUBBLES & SPINNING FLOWERS
         ============================================================ */
      const floatingLayer = document.getElementById("floatingLayer");
      const activeFloaters = [];

      let stickerCursor = 0;

      let stickerTimer = 0;

      function spawnSticker() {

        const el = document.createElement("div");

        const spread = Math.min(vw * 0.44, 410);

          el,
          life: 0,
          maxLife: 4.1 + Math.random() * 1.4,
          targetX: dir * spread * (0.3 + Math.random() * 0.7),
          targetY: -(vh * (0.58 + Math.random() * 0.3)),
          curveAmp: (Math.random() - 0.5) * 90,
          rotStart: (Math.random() - 0.5) * 20,

        });
      }

      function spawnPhotoBubble() {
        const item = CULTURAL_PHOTOS[photoCursor % CULTURAL_PHOTOS.length];
        photoCursor++;

        const el = document.createElement("div");
        el.className = "photo-bubble";
        el.style.setProperty("--bubble-ring", item.ring);
        el.style.setProperty("--bubble-glow", item.glow);

        const inner = document.createElement("div");
        inner.className = "photo-bubble-inner";
        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.caption;
        inner.appendChild(img);
        el.appendChild(inner);
        floatingLayer.appendChild(el);

        const spread = Math.min(vw * 0.43, 420);
        const dir = (Math.random() - 0.5) * 2;
        activeFloaters.push({
          el,
          life: 0,
          maxLife: 5.4 + Math.random() * 1.8,
          targetX: dir * spread * (0.25 + Math.random() * 0.75),
          targetY: -(vh * (0.76 + Math.random() * 0.22)),
          curveAmp: (Math.random() - 0.5) * 95,
          rotStart: (Math.random() - 0.5) * 10,
          rotEnd: (Math.random() - 0.5) * 24,
          scaleStart: 0.35,
          scaleEnd: 0.85 + Math.random() * 0.35
        });
      }

      function spawnSpinningFlower() {
        const key = FLOWER_KEYS[Math.floor(Math.random() * FLOWER_KEYS.length)];
        const el = document.createElement("img");
        el.className = "spinning-flower";
        el.src = flowerDataUrls[key];
        el.alt = "";
        floatingLayer.appendChild(el);

        const spread = Math.min(vw * 0.46, 450);
        const dir = (Math.random() - 0.5) * 2;
        activeFloaters.push({
          el,
          life: 0,
          maxLife: 4.8 + Math.random() * 1.8,
          targetX: dir * spread * (0.2 + Math.random() * 0.8),
          targetY: -(vh * (0.68 + Math.random() * 0.26)),
          curveAmp: (Math.random() - 0.5) * 110,
          rotStart: Math.random() * 180,
          rotEnd: (Math.random() > 0.5 ? 1 : -1) * (240 + Math.random() * 240),
          scaleStart: 0.3,
          scaleEnd: 0.75 + Math.random() * 0.45
        });
      }

      function updateFloaters(dt) {
        if (floatMode === "polaroids") {
          polaroidTimer -= dt;
          if (polaroidTimer <= 0) {
            if (activeFloaters.length < 18) spawnPolaroid();
            polaroidTimer = 0.68;
          }
          stickerTimer -= dt;
          if (stickerTimer <= 0) {
            if (activeFloaters.length < 20) spawnSticker();
            stickerTimer = 0.85;
          }
        } else if (floatMode === "bubbles") {
          bubbleTimer -= dt;
          if (bubbleTimer <= 0) {
            if (activeFloaters.length < 22) spawnPhotoBubble();
            bubbleTimer = 0.58;
          }
          flowerTimer -= dt;
          if (flowerTimer <= 0) {
            if (activeFloaters.length < 24) spawnSpinningFlower();
            flowerTimer = 0.44;
          }
        }

        for (let i = activeFloaters.length - 1; i >= 0; i--) {
          const f = activeFloaters[i];
          f.life += dt;
          const p = f.life / f.maxLife;
          if (p >= 1) {
            f.el.remove();
            activeFloaters.splice(i, 1);
            continue;
          }

          // Smooth deceleration upward along curved arc
          const easeY = 1 - Math.pow(1 - p, 1.85);
          const easeX = 1 - Math.pow(1 - p, 1.5);
          const x = f.targetX * easeX + Math.sin(p * Math.PI) * f.curveAmp;
          const y = f.targetY * easeY;
          const rot = f.rotStart + (f.rotEnd - f.rotStart) * p;
          const sc = f.scaleStart + (f.scaleEnd - f.scaleStart) * Math.min(1, p * 2.4);

          let alpha = 1;
          if (p < 0.12) alpha = p / 0.12;
          else if (p > 0.74) alpha = Math.max(0, (1 - p) / 0.26);

          f.el.style.transform = `translate3d(calc(-50% + ${x.toFixed(1)}px), ${y.toFixed(1)}px, 0) rotate(${rot.toFixed(1)}deg) scale(${sc.toFixed(3)})`;
          f.el.style.opacity = alpha.toFixed(3);
        }
      }

      /* ============================================================
         7. INTERACTION FLOW & TYPEWRITER LETTER (STAGES 2 -> 7)
         ============================================================ */
      const giftContainer = document.getElementById("giftContainer");
      const envelopeBtn = document.getElementById("envelopeBtn");
      const letterBackdrop = document.getElementById("letterBackdrop");
      const letterBody = document.getElementById("letterBody");
      const letterText = document.getElementById("letterText");
      const typingCursor = document.getElementById("typingCursor");
      const letterCloseBtn = document.getElementById("letterCloseBtn");

      const LETTER_CONTENT =
`Chào mừng Ngày Văn hóa Việt Nam 24/11!

Có những giá trị lặng thầm chảy suốt ngàn năm lịch sử, làm nên hồn cốt và niềm tự hào mang tên Việt Nam.

Ngày 24/11 không chỉ gợi nhắc dấu mốc "Văn hóa soi đường cho quốc dân đi", mà còn là dịp để mỗi người con đất Việt chậm lại một nhịp, trân quý những di sản cha ông để lại — từ tà áo dài thướt tha, tiếng đàn tranh sâu lắng đến nét đẹp nghĩa tình trong từng nếp nhà.

Chúc bạn có một ngày lễ 24/11 thật trọn vẹn, bình yên và đong đầy cảm hứng. Mong mỗi chúng ta luôn giữ trọn ngọn lửa tự hào, cùng gìn giữ và lan tỏa bản sắc văn hóa Việt vươn xa!

Chúc mừng Ngày Văn hóa Việt Nam 24/11!`;

      let stage = "closed"; // "closed" | "photos" | "envelope" | "letter" | "bubbles"
      let envelopeTimeoutId = null;
      let typewriterTimerId = null;

      function openGiftBox() {
        startBgMusicOnGiftClick();

        if (stage === "bubbles") {
          // Gentle joyful celebratory bounce if tapped during finale
          giftContainer.classList.remove("box-bounce");
          void giftContainer.offsetWidth;
          giftContainer.classList.add("box-bounce");
          spawnPhotoBubble();
          spawnSpinningFlower();
          spawnRocket();
          return;
        }

        if (stage !== "closed") return;
        stage = "photos";

        // 3. Lid pop & anchor open box at bottom-center
        giftContainer.classList.add("opened");
        giftContainer.setAttribute("aria-label", "Hộp quà Ngày Văn hóa Việt Nam đang mở");
        setTimeout(() => {
          giftContainer.classList.add("anchored");
        }, 280);

        // Full-screen Blooming Flower Burst
        triggerFlowerBurst(1800);

        // 4. Start continuous fireworks, Polaroids & Stickers
        fireworksActive = true;
        spawnRocket();
        setTimeout(spawnRocket, 240);

        floatMode = "polaroids";
        polaroidTimer = 0.25;
        stickerTimer = 0.45;

        // 5. After 5.5 seconds of floating photos, rise red-and-gold envelope to center
        envelopeTimeoutId = setTimeout(() => {
          if (stage !== "photos") return;
          stage = "envelope";
          envelopeBtn.tabIndex = 0;
          envelopeBtn.classList.add("rising");
          setTimeout(() => {
            if (stage === "envelope") envelopeBtn.classList.add("pulsing");
          }, 1150);
        }, 5500);
      }

      function startTypewriter() {
        letterText.textContent = "";
        typingCursor.classList.remove("done");
        let idx = 0;

        function step() {
          if (stage !== "letter") return;
          if (idx >= LETTER_CONTENT.length) {
            typingCursor.classList.add("done");
            return;
          }
          const ch = LETTER_CONTENT[idx++];
          letterText.textContent += ch;
          letterBody.scrollTop = letterBody.scrollHeight;

          let delay = 26;
          if (ch === "\n") delay = 190;
          else if (ch === "." || ch === "!" || ch === "—") delay = 140;
          else if (ch === ",") delay = 75;

          typewriterTimerId = setTimeout(step, delay);
        }
        step();
      }

      function openEnvelope() {
        startBgMusicOnGiftClick();
        if (stage !== "envelope") return;
        stage = "letter";

        envelopeBtn.classList.remove("rising", "pulsing");
        envelopeBtn.tabIndex = -1;

        // 6. Replay 1.5s Blooming Flower Burst, then reveal Do-paper letter card
        triggerFlowerBurst(1500, () => {
          letterBackdrop.classList.add("visible");
          letterCloseBtn.focus({ preventScroll: true });
          startTypewriter();
        });
      }

      function closeLetter() {
        if (stage !== "letter") return;
        stage = "bubbles";

        if (typewriterTimerId) {
          clearTimeout(typewriterTimerId);
          typewriterTimerId = null;
        }
        letterBackdrop.classList.remove("visible");

        // 7. Fireworks continue; launch circular photo bubbles & spinning flowers
        floatMode = "bubbles";
        bubbleTimer = 0.15;
        flowerTimer = 0.1;
        spawnPhotoBubble();
        spawnSpinningFlower();
      }

      giftContainer.addEventListener("click", openGiftBox);
      giftContainer.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openGiftBox();
        }
      });

      envelopeBtn.addEventListener("click", openEnvelope);
      envelopeBtn.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openEnvelope();
        }
      });

      letterCloseBtn.addEventListener("click", closeLetter);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && stage === "letter") {
          closeLetter();
        }
      });

      /* ============================================================
         8. UNIFIED 60FPS ANIMATION LOOP
         ============================================================ */
      let lastTime = performance.now();
      function frame(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        updateFireworks(dt);
        updateFloaters(dt);
        updateFlowerBurst(now);

        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
